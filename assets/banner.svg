<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="420" viewBox="0 0 1400 420">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050816"/>
      <stop offset="0.55" stop-color="#0b1028"/>
      <stop offset="1" stop-color="#16051f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="0.5" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff00d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#00f5ff" stroke-opacity=".09"/>
    </pattern>
  </defs>
  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1400" height="420" rx="28" fill="url(#grid)"/>
  <path d="M0 330 L1400 240" stroke="#00f5ff" stroke-opacity=".15" stroke-width="2"/>
  <path d="M0 380 L1400 275" stroke="#ff00d4" stroke-opacity=".12" stroke-width="2"/>
  <circle cx="1220" cy="80" r="150" fill="#7c3aed" opacity=".10"/>
  <circle cx="1180" cy="110" r="90" fill="#00f5ff" opacity=".08"/>
  <g transform="translate(90 70)">
    <circle cx="120" cy="120" r="102" fill="#070b19" stroke="url(#neon)" stroke-width="5" filter="url(#glow)"/>
    <circle cx="120" cy="120" r="85" fill="none" stroke="#d7a94b" stroke-width="2" opacity=".8"/>
    <text x="120" y="144" text-anchor="middle" font-family="Georgia,serif" font-size="86" font-weight="700" fill="#d7a94b">SN</text>
    <text x="120" y="190" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" letter-spacing="7" fill="#f5deb3">SI NASSER</text>
  </g>
  <g transform="translate(380 92)">
    <text x="0" y="48" font-family="Arial,sans-serif" font-size="64" font-weight="800" letter-spacing="5" fill="url(#neon)" filter="url(#glow)">NASSREDDINE</text>
    <text x="3" y="100" font-family="Arial,sans-serif" font-size="24" letter-spacing="4" fill="#dbeafe">WEB DEVELOPER • WORDPRESS • FRONTEND</text>
    <rect x="0" y="135" width="760" height="3" fill="url(#neon)"/>
    <text x="3" y="185" font-family="monospace" font-size="22" fill="#00f5ff">&gt; BUILDING MODERN DIGITAL EXPERIENCES</text>
    <text x="3" y="228" font-family="monospace" font-size="18" fill="#9ca3af">MOROCCO // ONLINE // OPEN TO COLLABORATION</text>
  </g>
  <rect x="24" y="24" width="1352" height="372" rx="22" fill="none" stroke="url(#neon)" stroke-width="2" opacity=".75"/>
